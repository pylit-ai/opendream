# Publish opendream to PyPI when you push a version tag (e.g. v0.1.0)
# or manually via workflow_dispatch.
# Uses Trusted Publishing (OIDC): no token in the repo. On PyPI, add a trusted publisher:
#   Project: opendream
#   Owner: pylit-ai
#   Repository: opendream
#   Workflow: publish-pypi.yml
#   Environment: pypi (must match GitHub Environment name below — workflow uses environment: pypi)
# See: https://docs.pypi.org/trusted-publishers/

name: Publish to PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read # required for actions/checkout (id-token alone drops default read)
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Release hygiene
        run: bash scripts/check_release_hygiene.sh

      - name: Build
        run: uv build

      - name: Publish to PyPI
        # Rely on OIDC only (no PYPI_TOKEN). Fails fast if trusted publisher is misconfigured.
        run: uv publish --trusted-publishing always

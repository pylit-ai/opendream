<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OpenDream splash with new wordmark - Dark</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#121826; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  .shell { width:min(86vw,1120px); }
  .panel { background:#161F2F; border:1px solid #243049; border-radius:20px; padding:18px; box-sizing:border-box; }
  video { width:100%; height:auto; display:block; border-radius:14px; }
  .meta { margin-top:14px; display:flex; justify-content:space-between; gap:12px; align-items:center; color:#98A2B3; font-size:14px; }
</style>
</head>
<body>
  <div class="shell">
    <div class="panel"><video autoplay muted playsinline controls loop src="../video/opendream_splash_wordmark_dark_1920x1080.mp4"></video></div>
    <div class="meta"><div>New wordmark - slower closure - steadier O mark</div></div>
  </div>
</body>
</html>

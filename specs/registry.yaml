    conflicts_with: []
    supersedes: []
    promoted_outputs:
      - README.md
      - pyproject.toml
      - LICENSE
      - CHANGELOG.md
      - SECURITY.md
    verification:
      - make verify passes on a fresh checkout
      - pip install . works in a clean venv
      - packaged schemas match canonical spec schemas
  - id: 403-runtime-integration-layer

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opendream-memory"
version = "0.1.0"
description = "Local-first memory subsystem for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
  {name = "OpenDream Maintainers"}
]
keywords = ["agents", "memory", "coding-agents", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "mypy>=1.11",
  "ruff>=0.11",
]

[project.scripts]
opendream-memory = "opendream_memory.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["opendream_memory*"]

[tool.setuptools.package-data]
opendream_memory = ["schema/*.json", "fixtures/*.json", "fixtures/*.jsonl"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["dist", ".tmp", "opendream_memory/webapp.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["opendream_memory", "scripts"]
pretty = true
show_error_codes = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
disallow_any_generics = true
exclude = ["^dist/", "^\\.tmp/", "^opendream_memory/webapp\\.py$", "^opendream_memory/observability\\.py$"]

[[tool.mypy.overrides]]
module = ["opendream_memory.webapp", "opendream_memory.observability", "tests.*"]
ignore_errors = true

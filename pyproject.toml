[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opendream-memory"
version = "0.1.0"
description = "Local-first memory subsystem for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
  {name = "OpenDream Maintainers"}
]
keywords = ["agents", "memory", "coding-agents", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]

[project.scripts]
opendream-memory = "opendream_memory.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["opendream_memory*"]

[tool.setuptools.package-data]
opendream_memory = ["schema/*.json", "fixtures/*.jsonl"]
